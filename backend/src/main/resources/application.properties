spring.application.name=testbuddy-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/testbuddy
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

testbuddy.jwt.secret=testbuddy-dev-secret-change-me-32chars-minimum!
testbuddy.jwt.expiration-ms=86400000

logging.level.org.springframework.security=INFO
